<!-- Dev harness. Counts the flickering elements on each state, because the neon
     rule is one sign per screen and two is a fault you cannot see in a still.
     --dump-dom returns the shell before React runs, so the count has to be
     taken inside a loaded page: same iframe trick as check.html. -->
<meta charset="utf-8"><style>body{margin:0;font:13px monospace;background:#111;color:#eee}
#o{padding:10px;white-space:pre}iframe{border:0;position:absolute;left:-9999px}</style>
<div id="o">measuring…</div><iframe id="f"></iframe>
<script>
const f = document.getElementById("f"), out = [];
const wait = ms => new Promise(r => setTimeout(r, ms));
(async () => {
  for (const k of ["open", "submitted", "pending", "all", "waiting", "missed"]) {
    f.style.width = "393px"; f.style.height = "1400px";
    f.src = `/?demo=${k}&player=Andrew%20Ishak&t=${k}`;
    await new Promise(r => f.onload = r); await wait(2600);
    const d = f.contentDocument;
    const els = [...d.querySelectorAll(".v-flicker")];
    const what = els.map(e => (e.textContent || "").trim().slice(0, 26).replace(/\s+/g, " "));
    out.push(`${k.padEnd(10)} ${els.length}  ${what.join(" | ")}`);
  }
  document.getElementById("o").textContent = out.join("\n");
})();
</script>
