<!-- Dev harness. The two schedule layouts side by side at phone width.
     v1 keeps the team block centred over its own half; v2 mirrors the whole
     card so the logos sit on the outer edges and the totals meet in the middle.
     Usage: /sched.html?w=393&h=1500&round=11 -->
<meta charset="utf-8" />
<title>F5 schedule layouts</title>
<style>
  body { margin: 0; background: #07070c; font-family: ui-sans-serif, system-ui; }
  .row { display: flex; gap: 16px; padding: 14px; align-items: flex-start; }
  .cap { color: #7ee787; font: 700 13px/1.5 ui-monospace, monospace;
         letter-spacing: .08em; padding: 6px 2px 8px; }
  .cap span { color: #6b7280; font-weight: 400; letter-spacing: 0; }
  iframe { border: 1px solid #1e2430; border-radius: 10px; display: block; background: #07070c; }
</style>
<div class="row" id="r"></div>
<script>
  const q = new URLSearchParams(location.search);
  const w = +(q.get("w") || 393), h = +(q.get("h") || 1500);
  const round = q.get("round") || "11";
  const player = q.get("player") || "Andrew Ishak";
  const V = [["1", "team block centred"], ["2", "mirrored, logos outside"]];
  document.getElementById("r").innerHTML = V.map(([v, note]) => `
    <div>
      <div class="cap">VERSION ${v} <span>— ${note}</span></div>
      <iframe width="${w}" height="${h}"
        src="/schedule?v=${v}&round=${round}&player=${encodeURIComponent(player)}"></iframe>
    </div>`).join("");
</script>
